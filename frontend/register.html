<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BloodConnect</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background-color: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 0; }
        .auth-container { width: 100%; max-width: 500px; padding: 30px; background: var(--bg-white); border-radius: var(--radius); box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }
        .role-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .role-tab { flex: 1; padding: 10px; text-align: center; border: 1px solid var(--border-light); background: var(--bg-light); border-radius: var(--radius); cursor: pointer; font-weight: 500; font-size: 14px; }
        .role-tab.active { background: var(--primary-red); color: white; border-color: var(--primary-red); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-light); border-radius: var(--radius); font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary-red); }
        .alert { padding: 10px; border-radius: var(--radius); font-size: 13px; margin-bottom: 15px; display: none; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 style="margin-bottom: 20px; text-align: center;"><i class="fa-solid fa-user-plus" style="color: var(--primary-red);"></i> Account Registration</h2>
        
        <!-- Role Tabs -->
        <div class="role-tabs">
            <div class="role-tab active" onclick="switchRegType('patient')">Patient Registration</div>
            <div class="role-tab" onclick="switchRegType('donor')">Donor Registration</div>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" required placeholder="+1 234 567 890">
            </div>
            <div class="form-group">
                <label>Blood Group</label>
                <select id="blood_group" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B-">B-</option>
                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    <option value="O+">O+</option><option value="O-">O-</option>
                </select>
            </div>
            <div class="form-group">
                <label>City / Location</label>
                <input type="text" id="location" required placeholder="New York">
            </div>

            <!-- Donor specific fields hidden by default -->
            <div id="donor-extra-fields" style="display: none;">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="25">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="123 Street Name">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Complete Registration</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; font-size: 13px;">
            <a href="/login.html" style="color: var(--text-muted);"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </p>
    </div>

    <script>
        let regType = 'patient';

        function switchRegType(type) {
            regType = type;
            const tabs = document.querySelectorAll('.role-tab');
            tabs.forEach(t => t.classList.remove('active'));
            
            if (type === 'donor') {
                tabs[1].classList.add('active');
                document.getElementById('donor-extra-fields').style.display = 'block';
            } else {
                tabs[0].classList.add('active');
                document.getElementById('donor-extra-fields').style.display = 'none';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';

            let payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                blood_group: document.getElementById('blood_group').value,
                location: document.getElementById('location').value
            };

            let endpoint = '/api/patients/register';

            if (regType === 'donor') {
                endpoint = '/api/donors/register';
                payload.age = parseInt(document.getElementById('age').value || 0);
                payload.gender = document.getElementById('gender').value;
                payload.address = document.getElementById('address').value || '';
            }

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Registration successful! Redirecting to login...';
                    alertBox.style.display = 'block';
                    setTimeout(() => window.location.href = `/login.html?role=${regType}`, 1500);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = data.detail || 'Registration failed.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Server connection error.';
                alertBox.style.display = 'block';
            }
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            if (role === 'donor') {
                switchRegType('donor');
            } else {
                switchRegType('patient');
            }
        };
    </script>
</body>
</html>
